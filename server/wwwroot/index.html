<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Đọc Truyện Online Miễn Phí</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#b2c2f0] text-gray-100 font-sans">
    <header class="bg-[#3c6ad3] border-b border-blue-900 sticky top-0 z-50 shadow-lg shadow-blue-900/20">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-book-open text-blue-100"></i> CMC Truyện
            </a>

            <div class="w-full md:w-1/3 order-3 md:order-2 mt-3 md:mt-0 relative">

                       class="w-full bg-white text-slate-900 placeholder-slate-400 pl-4 pr-10 py-2 rounded-full border border-slate-200 focus:outline-none focus:border-slate-300 text-sm shadow-sm">
                <button class="absolute right-3 top-1/2 -translate-y-1/2 h-8 w-8 flex items-center justify-center text-[#3c6ad3] hover:text-blue-700">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <nav class="flex items-center gap-6 order-2 md:order-3 text-sm font-medium text-white">
                <a href="pages/stories.html" class="hover:text-blue-100 transition"><i class="fa-solid fa-chart-line mr-1"></i>Xếp Hạng</a>
                <a href="pages/login.html" class="bg-white text-[#1d3d74] px-4 py-2 rounded-full font-bold hover:bg-blue-100 transition flex items-center gap-2">
                    <i class="fa-solid fa-user"></i> Đăng Nhập
                </a>
            </nav>
        </div>
    </header>
    <header class="bg-[#3c6ad3] border-b border-blue-900 sticky top-16 z-40 shadow-lg shadow-blue-900/20">
        <div class="container mx-auto px-4 py-2 flex items-center gap-10 text-sm font-medium text-white">
            <a href="index.html" class="hover:text-blue-100 transition">Trang Chủ</a>
            <a href="pages/genres.html" class="hover:text-blue-100 transition">Thể Loại</a>
            <a href="pages/stories.html" class="hover:text-blue-100 transition">Tìm Truyện</a>
            <a href="pages/profile.html" class="hover:text-blue-100 transition">Lịch Sử</a>
            <a href="pages/profile.html" class="hover:text-blue-100 transition">Theo Dõi</a>
