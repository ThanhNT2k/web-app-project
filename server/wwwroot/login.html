<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - CMC Truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f3f4f6] text-slate-900">
    <header class="bg-[#3c6ad3] text-white sticky top-0 z-50 shadow-lg shadow-blue-900/20">
        <div class="main-container px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <a href="../index.html" class="text-xl font-bold">CMC Truyện</a>
            <nav class="flex flex-wrap gap-4 text-sm">
                <a href="../index.html" class="hover:text-blue-100">Trang Chủ</a>
                <a href="stories.html" class="hover:text-blue-100">Tìm Truyện</a>
                <a href="genres.html" class="hover:text-blue-100">Thể Loại</a>
                <a href="profile.html" class="hover:text-blue-100">Profile</a>
            </nav>
        </div>
    </header>

    <main class="main-container px-4 py-10">
        <div class="grid gap-8 lg:grid-cols-2">
            <section class="bg-white rounded-3xl p-8 card-shadow">
                <h1 class="text-2xl font-semibold mb-6">Đăng nhập</h1>
                <form>
                    <label class="block text-sm font-medium text-slate-700">Email</label>
                    <input type="email" placeholder="Nhập email" class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-[#3c6ad3] focus:outline-none mb-4">
                    <label class="block text-sm font-medium text-slate-700">Mật khẩu</label>
                    <input type="password" placeholder="Nhập mật khẩu" class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-[#3c6ad3] focus:outline-none mb-6">
                    <button class="w-full rounded-full bg-[#3c6ad3] text-white py-3 font-semibold hover:bg-blue-600 transition">Đăng nhập</button>
                </form>
            </section>

            <section class="bg-white rounded-3xl p-8 card-shadow">
                <h1 class="text-2xl font-semibold mb-6">Đăng ký</h1>
                <form>
                    <label class="block text-sm font-medium text-slate-700">Họ và tên</label>
                    <input type="text" placeholder="Nhập họ và tên" class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-[#3c6ad3] focus:outline-none mb-4">
                    <label class="block text-sm font-medium text-slate-700">Email</label>
                    <input type="email" placeholder="Nhập email" class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-[#3c6ad3] focus:outline-none mb-4">
                    <label class="block text-sm font-medium text-slate-700">Mật khẩu</label>
                    <input type="password" placeholder="Nhập mật khẩu" class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-[#3c6ad3] focus:outline-none mb-4">
                    <button class="w-full rounded-full bg-[#0f4ecd] text-white py-3 font-semibold hover:bg-blue-700 transition">Đăng ký</button>
                </form>
            </section>
        </div>
    </main>

    <script src="../js/auth-modals.js"></script>
</body>
</html>
