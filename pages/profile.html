<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .profile-header {
            background: var(--primary-color);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
            box-shadow: var(--shadow);
        }
        .profile-avatar {
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem;
        }
        .history-item {
            background: white; padding: 1.25rem; border-radius: 10px;
            margin-bottom: 1rem; display: flex; justify-content: space-between;
            align-items: center; box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .history-item:hover { transform: translateX(5px); border-left: 4px solid var(--primary-color); }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="/index.html" class="logo">📚 CMC Truyện</a>
            <nav id="auth-links"></nav>
        </div>
    </header>

    <main>
        <section class="profile-header">
            <div class="profile-avatar">👤</div>
            <div class="profile-info">
                <h1 id="user-name-display">Đang tải...</h1>
                <p id="user-role-display" class="profile-role">...</p>
                <button onclick="deleteAccount()" class="btn" style="background: var(--danger-color); color: white; margin-top: 1rem; padding: 0.5rem 1rem;">Xóa tài khoản</button>
            </div>
        </section>
        
        <h2>Lịch sử đọc gần đây</h2>
        <div id="history-container" style="margin-top: 1rem;">
            <p>Đang tải dữ liệu lịch sử...</p>
        </div>
    </main>

    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleAuthModal(false)">&times;</span>
            <h2>Đăng Nhập</h2>
            <form id="login-form">
                <div class="form-group"><input type="email" placeholder="Email" required></div>
                <div class="form-group"><input type="password" placeholder="Mật khẩu" required></div>
                <button type="submit" class="btn btn-primary">ĐĂNG NHẬP</button>
            </form>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Kiểm tra đăng nhập
            if (!isLoggedIn()) {
                window.location.href = '/pages/account.html';
                return;
            }

            // 2. Hiển thị thông tin
            const user = getCurrentUser();
            document.getElementById('user-name-display').textContent = user.userName || 'Người dùng';
            document.getElementById('user-role-display').textContent = user.role || 'Member';
            
            // Cập nhật lại Navbar
            if (typeof syncNavbarUI === 'function') syncNavbarUI();

            // 3. Load lịch sử đọc
            const container = document.getElementById('history-container');
            try {
                // Giả sử bạn có hàm getReadingHistory() trong api.js hoặc định nghĩa ở đây
                const history = await getReadingHistory(); 
                if (!history || history.length === 0) {
                    container.innerHTML = '<p>Bạn chưa đọc bộ truyện nào gần đây.</p>';
                } else {
                    container.innerHTML = history.map(item => `
                        <div class="history-item">
                            <div class="history-story">
                                <h3><a href="/pages/comic.html?slug=${item.comicSlug}" style="color: var(--primary-color); text-decoration: none;">${item.comicTitle}</a></h3>
                                <p style="font-size: 0.85rem; color: #666;">Chương ${item.chapterNumber} • ${formatDate(item.updatedAt)}</p>
                            </div>
                            <a href="/pages/comic.html?slug=${item.comicSlug}" class="btn btn-primary" style="width: auto;">Đọc tiếp</a>
                        </div>
                    `).join('');
                }
            } catch (err) {
                container.innerHTML = '<p style="color: var(--danger-color);">Không thể tải lịch sử đọc.</p>';
            }
        });

        function formatDate(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
        }
    </script>
</body>
</html>
