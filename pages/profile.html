<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .profile-header {
            background: var(--primary-color);
            color: white;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .profile-info h1 {
            margin-bottom: 0.5rem;
        }

        .profile-role {
            background: rgba(255,255,255,0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            padding: 1rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            font-weight: 500;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .history-item {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .history-story {
            flex: 1;
        }

        .history-story h3 {
            margin-bottom: 0.5rem;
        }

        .history-story p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .progress-bar {
            width: 200px;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 45%;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-avatar {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .history-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- Header / Navbar -->
    <header>
        <div class="navbar">
            <a href="/index.html" class="logo">📚 CMC Truyện</a>
            <nav>
                <a href="/pages/story.html" class="nav-link">Tìm Truyện</a>
                <a href="/pages/profile.html" class="nav-link">Profile</a>
                <div id="auth-links">
                    <a href="/pages/account.html" class="nav-link">Đăng nhập</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Profile Header -->
        <div class="profile-header" id="profile-header">
            <div class="profile-avatar">👤</div>
            <div class="profile-info">
                <h1 id="user-name">Tên người dùng</h1>
                <p id="user-email">email@example.com</p>
                <p class="profile-role" id="user-role">User</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="history">📖 Lịch Sử Đọc</button>
            <button class="tab-btn" data-tab="favorites">❤️ Truyện Yêu Thích</button>
            <button class="tab-btn" data-tab="settings">⚙️ Cài Đặt</button>
        </div>

        <!-- Tab: History -->
        <div id="history" class="tab-content active">
            <h2 style="margin-bottom: 2rem;">📖 Lịch Sử Đọc</h2>
            <div id="history-list">
                <div class="loading">Đang tải...</div>
            </div>
        </div>

        <!-- Tab: Favorites -->
        <div id="favorites" class="tab-content">
            <h2 style="margin-bottom: 2rem;">❤️ Truyện Yêu Thích</h2>
            <div id="favorites-list" class="stories-grid">
                <div class="loading">Đang tải...</div>
            </div>
        </div>

        <!-- Tab: Settings -->
        <div id="settings" class="tab-content">
            <h2 style="margin-bottom: 2rem;">⚙️ Cài Đặt</h2>
            <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 600px;">
                <form id="settings-form">
                    <div class="form-group">
                        <label for="setting-fullname">Tên đầy đủ:</label>
                        <input type="text" id="setting-fullname" required>
                    </div>

                    <div class="form-group">
                        <label for="setting-bio">Tiểu sử:</label>
                        <textarea id="setting-bio" rows="4" placeholder="Viết gì đó về bạn..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="setting-password">Mật khẩu mới (để trống nếu không đổi):</label>
                        <input type="password" id="setting-password">
                    </div>

                    <div class="form-group">
                        <label for="setting-theme">Chủ đề:</label>
                        <select id="setting-theme">
                            <option value="light">Sáng</option>
                            <option value="dark">Tối</option>
                            <option value="auto">Tự động</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Lưu Cài Đặt</button>
                </form>

                <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                    <h3 style="color: var(--danger-color); margin-bottom: 1rem;">⚠️ Nguy Hiểm</h3>
                    <button onclick="deleteAccount()" class="btn btn-danger">Xóa Tài Khoản</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 CMC Truyện. Tất cả quyền được bảo lưu.</p>
    </footer>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Require login
        requireLogin();

        // Load profile
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const user = getCurrentUser();
                document.getElementById('user-name').textContent = user.userName || 'Người dùng';
                document.getElementById('user-email').textContent = user.userId || '';
                document.getElementById('user-role').textContent = user.role || 'User';

                // Load reading history
                const history = await getReadingHistory();
                displayHistory(history);

                // Load favorites
                const favorites = await getFavoriteStories();
                renderStories(favorites, 'favorites-list');

                // Load settings
                const profile = await getProfile();
                if (profile) {
                    document.getElementById('setting-fullname').value = user.userName || '';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }

            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabName = btn.getAttribute('data-tab');
                    switchTab(tabName);
                });
            });

            // Settings form
            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                try {
                    await updateProfile({
                        fullName: document.getElementById('setting-fullname').value,
                        bio: document.getElementById('setting-bio').value
                    });
                    showNotification('Cập nhật cài đặt thành công!', 'success');
                } catch (error) {
                    showNotification('Lỗi cập nhật cài đặt', 'error');
                }
            });
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function displayHistory(history) {
            const container = document.getElementById('history-list');
            if (!history || history.length === 0) {
                container.innerHTML = '<p class="text-center" style="color: var(--text-light);">Chưa có lịch sử đọc</p>';
                return;
            }

            container.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-story">
                        <h3><a href="/pages/story.html?id=${item.storyId}" style="color: var(--primary-color); text-decoration: none;">${item.storyTitle}</a></h3>
                        <p>Chương ${item.chapter} - ${formatDate(item.readDate)}</p>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(item.chapter / item.totalChapters) * 100}%"></div>
                        </div>
                    </div>
                    <a href="/pages/story.html?id=${item.storyId}" class="btn btn-primary">Tiếp tục đọc</a>
                </div>
            `).join('');
        }

        function deleteAccount() {
            if (confirm('Bạn có chắc chắn muốn xóa tài khoản? Hành động này không thể hoàn tác!')) {
                logout();
                showNotification('Tài khoản đã được xóa', 'success');
            }
        }
    </script>
</body>
</html>
