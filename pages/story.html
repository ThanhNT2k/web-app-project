<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Truyện - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <a href="/index.html" class="logo">📚 CMC Truyện</a>
            <nav>
                <a href="/pages/story.html" class="nav-link">Tìm Truyện</a>
                <a href="/pages/story.html?genre=all" class="nav-link">Thể Loại</a>
                <div id="auth-links">
                    <a href="/pages/account.html" class="nav-link">Đăng nhập</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <h1 style="margin-bottom: 2rem;">📚 Tìm Truyện</h1>

        <section style="background: white; padding: 2rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: var(--shadow);">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label for="search-input">🔍 Tìm kiếm:</label>
                    <input type="text" id="search-input" placeholder="Nhập tên truyện hoặc tác giả...">
                </div>
                <div class="form-group">
                    <label for="genre-filter">📁 Thể loại:</label>
                    <select id="genre-filter">
                        <option value="">-- Tất cả --</option>
                        </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="status-filter">📊 Trạng thái:</label>
                    <select id="status-filter">
                        <option value="">-- Tất cả --</option>
                        <option value="Full">Hoàn thành</option>
                        <option value="Ongoing">Đang cập nhật</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sort-filter">⬇️ Sắp xếp:</label>
                    <select id="sort-filter">
                        <option value="newest">Mới nhất</option>
                        <option value="popular">Phổ biến nhất</option>
                        <option value="rating">Đánh giá cao</option>
                    </select>
                </div>
            </div>

            <button onclick="applyFilters()" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Tìm kiếm</button>
        </section>

        <section>
            <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                <h2 id="results-title">Kết quả tìm kiếm</h2>
                <span id="results-count" style="color: var(--text-light);">0 truyện</span>
            </div>
            <div id="stories-results" class="stories-grid">
                <div class="loading">Đang tải...</div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CMC Truyện. Tất cả quyền được bảo lưu.</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        let allComics = [];

        // Load dữ liệu khi trang tải
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Tải danh sách Thể loại thực tế từ DB để đổ vào ô Select filter
            try {
                const genres = await getGenres() || [];
                const genreFilterSelect = document.getElementById('genre-filter');
                if (genreFilterSelect && genres.length > 0) {
                    // Giữ lại option đầu tiên ("Tất cả") và append thêm dữ liệu động từ API
                    genreFilterSelect.innerHTML = '<option value="">-- Tất cả --</option>' + 
                        genres.map(g => `<option value="${g.slug || g.id}">${g.name}</option>`).join('');
                }
            } catch (error) {
                console.error('Không thể tải danh sách thể loại:', error);
            }

            // 2. Tải danh sách truyện tranh công khai (Tối đa 50 bản ghi mẫu để filter)
            try {
                const response = await getComics(1, 50) || {};
                // Chuẩn hóa dữ liệu nhận về từ API (phòng trường hợp trả về object phân trang { items: [] } hoặc array trực tiếp)
                allComics = response.items || response || []; 
                displayComics(allComics);
                updateResultsCount(allComics.length);
            } catch (error) {
                if (typeof showNotification === 'function') {
                    showNotification('Lỗi tải dữ liệu truyện tranh', 'error');
                } else {
                    alert('Lỗi tải dữ liệu truyện tranh');
                }
            }

            // Gắn các trình lắng nghe sự kiện thay đổi bộ lọc để cập nhật kết quả theo thời gian thực (Real-time Filter)
            document.getElementById('search-input').addEventListener('input', applyFilters);
            document.getElementById('genre-filter').addEventListener('change', applyFilters);
            document.getElementById('status-filter').addEventListener('change', applyFilters);
            document.getElementById('sort-filter').addEventListener('change', applyFilters);
        });

        // Hàm xử lý áp dụng bộ lọc dữ liệu truyện tranh
        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const genreFilter = document.getElementById('genre-filter').value;
            const statusFilter = document.getElementById('status-filter').value;
            const sortFilter = document.getElementById('sort-filter').value;

            let filtered = allComics.filter(comic => {
                // Khớp dữ liệu theo Tên truyện hoặc Tác giả (hỗ trợ camelCase/PascalCase linh hoạt)
                const title = comic.title || comic.name || '';
                const author = comic.author || '';
                const matchSearch = title.toLowerCase().includes(searchTerm) || 
                                    author.toLowerCase().includes(searchTerm);
                
                // Khớp dữ liệu trạng thái
                const matchStatus = !statusFilter || comic.status === statusFilter;
                
                // Khớp dữ liệu thể loại (Kiểm tra qua mảng genres hoặc chuỗi genreSlug/genreId của truyện)
                const matchGenre = !genreFilter || 
                                   (comic.genreSlug && comic.genreSlug === genreFilter) ||
                                   (comic.genreId && comic.genreId.toString() === genreFilter) ||
                                   (comic.genres && comic.genres.some(g => (g.slug === genreFilter || g.id.toString() === genreFilter)));
                
                return matchSearch && matchStatus && matchGenre;
            });

            // Sắp xếp dữ liệu theo yêu cầu
            if (sortFilter === 'popular') {
                filtered.sort((a, b) => (b.totalViews || b.views || 0) - (a.totalViews || a.views || 0));
            } else if (sortFilter === 'rating') {
                filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            } else if (sortFilter === 'newest') {
                filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            }

            displayComics(filtered);
            updateResultsCount(filtered.length);
        }

        // Gọi hàm kết xuất HTML chuẩn hóa trong main.js
        function displayComics(comics) {
            if (typeof renderComics === 'function') {
                renderComics(comics, 'stories-results');
            } else if (typeof renderStories === 'function') {
                // Hỗ trợ fallback nếu main.js vẫn dùng tên hàm cũ
                renderStories(comics, 'stories-results');
            } else {
                const container = document.getElementById('stories-results');
                if (container) {
                    if (comics.length === 0) {
                        container.innerHTML = '<p class="text-center" style="grid-column: 1/-1; padding: 2rem;">Không tìm thấy truyện phù hợp.</p>';
                        return;
                    }
                    container.innerHTML = comics.map(c => `
                        <article class="story-card">
                            <div class="story-image">
                                <img src="${c.coverUrl || '/assets/placeholder.jpg'}" alt="${c.title || c.name}">
                            </div>
                            <div class="story-info">
                                <h3 class="story-title">
                                    <a href="/pages/comic.html?slug=${c.slug}">${c.title || c.name}</a>
                                </h3>
                                <div class="story-meta">
                                    <span class="story-status">${c.status || 'Ongoing'}</span>
                                </div>
                                <a href="/pages/comic.html?slug=${c.slug}" class="btn btn-primary">Đọc truyện</a>
                            </div>
                        </article>
                    `).join('');
                }
            }
        }

        // Cập nhật số lượng đếm kết quả hiển thị
        function updateResultsCount(count) {
            const el = document.getElementById('results-count');
            if (el) el.textContent = `${count} truyện`;
        }
    </script>
</body>
</html>
