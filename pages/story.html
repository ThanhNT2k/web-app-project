<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Truyện - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <a href="/index.html" class="logo">📚 CMC Truyện</a>
            <nav>
                <a href="/pages/story.html" class="nav-link">Tìm Truyện</a>
                <a href="/pages/story.html?genre=all" class="nav-link">Thể Loại</a>
                <div id="auth-links">
                    <a href="javascript:void(0)" class="nav-link" onclick="window.toggleAuthModal(true)">Đăng nhập</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <h1 style="margin-bottom: 2rem;">📚 Tìm Truyện</h1>

        <section style="background: white; padding: 2rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: var(--shadow);">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label for="search-input">🔍 Tìm kiếm:</label>
                    <input type="text" id="search-input" placeholder="Nhập tên truyện hoặc tác giả...">
                </div>
                <div class="form-group">
                    <label for="genre-filter">📁 Thể loại:</label>
                    <select id="genre-filter">
                        <option value="">-- Tất cả --</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="status-filter">📊 Trạng thái:</label>
                    <select id="status-filter">
                        <option value="">-- Tất cả --</option>
                        <option value="Full">Hoàn thành</option>
                        <option value="Ongoing">Đang cập nhật</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sort-filter">⬇️ Sắp xếp:</label>
                    <select id="sort-filter">
                        <option value="newest">Mới nhất</option>
                        <option value="popular">Phổ biến nhất</option>
                        <option value="rating">Đánh giá cao</option>
                    </select>
                </div>
            </div>
            <button onclick="window.applyFilters()" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Tìm kiếm</button>
        </section>

        <section>
            <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                <h2 id="results-title">Kết quả tìm kiếm</h2>
                <span id="results-count" style="color: var(--text-light);">0 truyện</span>
            </div>
            <div id="stories-results" class="stories-grid">
                <div class="loading">Đang tải...</div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CMC Truyện. Tất cả quyền được bảo lưu.</p>
    </footer>

    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/main.js"></script>
    <script type="module">
        import { getGenres } from '../js/genres.js';
        import { getComics } from '../js/novels.js';

        let allComics = [];

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const genresResponse = await getGenres();
                const genres = genresResponse.data || [];
                const genreFilterSelect = document.getElementById('genre-filter');
                if (genreFilterSelect && genres.length > 0) {
                    genreFilterSelect.innerHTML = '<option value="">-- Tất cả --</option>' + 
                        genres.map(g => `<option value="${g.slug || g.id}">${g.name}</option>`).join('');
                }
            } catch (error) {
                console.error('Lỗi tải thể loại:', error);
            }

            try {
                const response = await getComics({ page: 1, limit: 50 });
                allComics = response.data || []; 
                window.displayComics(allComics);
                window.updateResultsCount(allComics.length);
            } catch (error) {
                console.error('Lỗi tải dữ liệu truyện:', error);
            }

            document.getElementById('search-input').addEventListener('input', window.applyFilters);
            document.getElementById('genre-filter').addEventListener('change', window.applyFilters);
            document.getElementById('status-filter').addEventListener('change', window.applyFilters);
            document.getElementById('sort-filter').addEventListener('change', window.applyFilters);
        });

        window.applyFilters = function() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const genreFilter = document.getElementById('genre-filter').value;
            const statusFilter = document.getElementById('status-filter').value;
            const sortFilter = document.getElementById('sort-filter').value;

            let filtered = allComics.filter(comic => {
                const title = comic.title || comic.name || '';
                const author = comic.author || '';
                const matchSearch = title.toLowerCase().includes(searchTerm) || author.toLowerCase().includes(searchTerm);
                const matchStatus = !statusFilter || comic.status === statusFilter;
                
                const matchGenre = !genreFilter || 
                                   (comic.genreSlug && comic.genreSlug === genreFilter) ||
                                   (comic.genreId && comic.genreId.toString() === genreFilter) ||
                                   (comic.genres && comic.genres.some(g => g.slug === genreFilter || g.id.toString() === genreFilter));
                
                return matchSearch && matchStatus && matchGenre;
            });

            if (sortFilter === 'popular') filtered.sort((a, b) => (b.totalViews || b.views || 0) - (a.totalViews || a.views || 0));
            else if (sortFilter === 'rating') filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            else if (sortFilter === 'newest') filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

            window.displayComics(filtered);
            window.updateResultsCount(filtered.length);
        };

        window.displayComics = function(comics) {
            window.renderComics(comics, 'stories-results');
        };

        window.updateResultsCount = function(count) {
            const el = document.getElementById('results-count');
            if (el) el.textContent = `${count} truyện`;
        };
    </script>
    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" onclick="window.toggleAuthModal(false)">&times;</span>
            <h2>Đăng Nhập</h2>
            <div id="auth-form-container">
                <form id="login-form">
                    <div class="form-group"><input type="email" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" placeholder="Mật khẩu" required></div>
                    <button type="submit" class="btn btn-primary">ĐĂNG NHẬP</button>
                </form>
                <p style="margin-top: 1rem; text-align: center; color: #6b7280;">
                    Chưa có tài khoản? <a href="#" onclick="window.switchForm('register')">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
