<script>
    let allComics = [];

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            // Gọi hàm getComics công khai mới từ api.js (Lấy tối đa 50 bản ghi làm mẫu để filter)
            const response = await getComics(1, 50) || {};
            allComics = response.items || response || []; 
            displayComics(allComics);
        } catch (error) {
            showNotification('Lỗi tải dữ liệu truyện tranh', 'error');
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('genre-filter').addEventListener('change', applyFilters);
        document.getElementById('status-filter').addEventListener('change', applyFilters);
        document.getElementById('sort-filter').addEventListener('change', applyFilters);
    });

    function applyFilters() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        const statusFilter = document.getElementById('status-filter').value;
        const sortFilter = document.getElementById('sort-filter').value;

        let filtered = allComics.filter(comic => {
            const matchSearch = comic.title.toLowerCase().includes(searchTerm) || 
                              (comic.author && comic.author.toLowerCase().includes(searchTerm));
            const matchStatus = !statusFilter || comic.status === statusFilter;
            return matchSearch && matchStatus;
        });

        if (sortFilter === 'popular') {
            filtered.sort((a, b) => (b.totalViews || 0) - (a.totalViews || 0));
        }
        
        displayComics(filtered);
        updateResultsCount(filtered.length);
    }

    function displayComics(comics) {
        renderComics(comics, 'stories-results'); // Sử dụng hàm renderComics chuẩn mới trong main.js
    }

    function updateResultsCount(count) {
        document.getElementById('results-count').textContent = `${count} truyện`;
    }
</script>
