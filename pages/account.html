<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main>
        <div class="auth-container">
            <div class="auth-box">
                <h2>Đăng Nhập</h2>
                <form id="login-form">
                    <div class="form-group"><input type="email" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" placeholder="Mật khẩu" required></div>
                    <button type="submit" class="btn btn-primary">ĐĂNG NHẬP</button>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target[0].value;
            const password = e.target[1].value;
            try {
                // Giả sử bạn sử dụng supabaseClient
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                await handleLoginSuccess(data.session.access_token);
                window.location.href = '/pages/profile.html';
            } catch (err) {
                alert('Đăng nhập thất bại: ' + err.message);
            }
        });
    </script>
</body>
</html>
