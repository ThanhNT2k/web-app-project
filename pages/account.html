<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .hidden { display: none; }
        .switch-auth { margin-top: 15px; text-align: center; font-size: 14px; }
        .switch-auth a { color: #007bff; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <main>
        <div class="auth-container">
            <div class="auth-box" id="login-box">
                <h2>Đăng Nhập</h2>
                <form id="login-form">
                    <div class="form-group"><input type="email" id="login-email" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" id="login-password" placeholder="Mật khẩu" required></div>
                    <button type="submit" class="btn btn-primary">ĐĂNG NHẬP</button>
                </form>
                <div class="switch-auth">
                    Chưa có tài khoản? <a id="go-to-register">Đăng ký ngay</a>
                </div>
            </div>

            <div class="auth-box hidden" id="register-box">
                <h2>Đăng Ký Tài Khoản</h2>
                <form id="register-form">
                    <div class="form-group"><input type="text" id="register-username" placeholder="Tên hiển thị" required></div>
                    <div class="form-group"><input type="email" id="register-email" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" id="register-password" placeholder="Mật khẩu" required></div>
                    <button type="submit" class="btn btn-primary">ĐĂNG KÝ</button>
                </form>
                <div class="switch-auth">
                    Đã có tài khoản? <a id="go-to-login">Đăng nhập</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { register, login } from '../js/auth.js';

        // Hiệu ứng chuyển đổi form qua lại
        document.getElementById('go-to-register').addEventListener('click', () => {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('register-box').classList.remove('hidden');
        });

        document.getElementById('go-to-login').addEventListener('click', () => {
            document.getElementById('register-box').classList.add('hidden');
            document.getElementById('login-box').classList.remove('hidden');
        });

        // --- XỬ LÝ SỰ KIỆN ĐĂNG KÝ ---
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("-> Bấm nút Đăng ký, tiến hành gọi hàm modular auth.js");

            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            // Gọi hàm từ file auth.js của bạn
            const result = await register({ username, email, password });

            if (result.success) {
                alert('Đăng ký tài khoản thành công!');
                document.getElementById('go-to-login').click(); // Chuyển về form login
            } else {
                console.error("Lỗi Đăng ký từ API:", result.error);
                alert('Đăng ký thất bại: ' + result.error);
            }
        });

        // --- XỬ LÝ SỰ KIỆN ĐĂNG NHẬP ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("-> Bấm nút Đăng nhập");

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // Gọi hàm từ file auth.js của bạn
            const result = await login({ email, password });

            if (result.success) {
                alert('Đăng nhập thành công!');
                window.location.href = '/pages/profile.html';
            } else {
                console.error("Lỗi Đăng nhập từ API:", result.error);
                alert('Đăng nhập thất bại: ' + result.error);
            }
        });
    </script>
</body>
</html>
