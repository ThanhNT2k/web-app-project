<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .hidden { display: none; }
        .switch-auth { margin-top: 15px; text-align: center; font-size: 14px; }
        .switch-auth a { color: #007bff; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <main>
        <div class="auth-container">
            <div class="auth-box" id="login-box">
                <h2>Đăng Nhập</h2>
                <form id="login-form">
                    <div class="form-group"><input type="email" id="login-email" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" id="login-password" placeholder="Mật khẩu" required></div>
                    <button type="submit" class="btn btn-primary">ĐĂNG NHẬP</button>
                </form>
                <div class="switch-auth">
                    Chưa có tài khoản? <a id="go-to-register">Đăng ký ngay</a>
                </div>
            </div>

            <div class="auth-box hidden" id="register-box">
                <h2>Đăng Ký Tài Khoản</h2>
                <form id="register-form">
                    <div class="form-group"><input type="text" id="register-username" placeholder="Tên hiển thị" required></div>
                    <div class="form-group"><input type="email" id="register-email" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" id="register-password" placeholder="Mật khẩu" required></div>
                    <button type="submit" class="btn btn-primary">ĐĂNG KÝ</button>
                </form>
                <div class="switch-auth">
                    Đã có tài khoản? <a id="go-to-login">Đăng nhập</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://webappbe-fzz7.onrender.com";

        // Chờ HTML tải xong để gắn sự kiện nút bấm
        document.addEventListener("DOMContentLoaded", () => {
            console.log("Hệ thống Script Độc Lập đã khởi động thành công!");

            // Hiệu ứng chuyển đổi form qua lại
            document.getElementById('go-to-register').addEventListener('click', () => {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('register-box').classList.remove('hidden');
            });

            document.getElementById('go-to-login').addEventListener('click', () => {
                document.getElementById('register-box').classList.add('hidden');
                document.getElementById('login-box').classList.remove('hidden');
            });

            // --- XỬ LÝ SỰ KIỆN ĐĂNG KÝ ---
            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log("-> Kích hoạt sự kiện Đăng ký");

                const username = document.getElementById('register-username').value;
                const email = document.getElementById('register-email').value;
                const password = document.getElementById('register-password').value;

                try {
                    const response = await fetch(`${BACKEND_URL}/api/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });

                    console.log("Status phản hồi từ Server:", response.status);

                    if (response.ok) {
                        const data = await response.json();
                        alert('Đăng ký thử nghiệm THÀNH CÔNG!');
                        document.getElementById('go-to-login').click(); 
                    } else {
                        const errorText = await response.text();
                        alert(`Lỗi Đăng ký (${response.status}): ${errorText}`);
                    }
                } catch (err) {
                    console.error("Lỗi mạng:", err);
                    alert('Lỗi kết nối mạng: ' + err.message);
                }
            });

            // --- XỬ LÝ SỰ KIỆN ĐĂNG NHẬP ---
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log("-> Kích hoạt sự kiện Đăng nhập");

                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                try {
                    const response = await fetch(`${BACKEND_URL}/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: email, password: password })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        // Lưu token thẳng vào localStorage
                        if (data.token || data.Token) {
                            localStorage.setItem('token', data.token || data.Token);
                        }
                        alert('Đăng nhập thành công!');
                        window.location.href = '/pages/profile.html';
                    } else {
                        alert('Đăng nhập thất bại: Sai tài khoản hoặc mật khẩu');
                    }
                } catch (err) {
                    console.error("Lỗi mạng:", err);
                    alert('Lỗi kết nối mạng: ' + err.message);
                }
            });
        });
    </script>
</body>
</html>
