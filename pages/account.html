<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>

<script>
    // 1. Khởi tạo Supabase Client (Điền đúng thông tin dự án của bạn)
    const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Kiểm tra chuyển hướng nếu đã có phiên làm việc
    if (isLoggedIn()) {
        window.location.href = '/index.html';
    }

    // Xử lý Sự kiện Đăng Nhập qua Supabase Auth
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;

            if (data?.session) {
                // Kích hoạt bóc tách Profile và phân quyền từ backend .NET Core
                await handleLoginSuccess(data.session.access_token);
                showNotification('Đăng nhập thành công!', 'success');
                setTimeout(() => { window.location.href = '/index.html'; }, 1000);
            }
        } catch (error) {
            showNotification(`Lỗi: ${error.message || 'Tài khoản hoặc mật khẩu không đúng'}`, 'error');
        }
    });

    // Xử lý Sự kiện Đăng Ký qua Supabase Auth
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const passwordConfirm = document.getElementById('register-password-confirm').value;

        if (password !== passwordConfirm) {
            showNotification('Mật khẩu không trùng khớp', 'error');
            return;
        }

        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { full_name: fullName } } // Gửi kèm dữ liệu metadata cho DB trigger xử lý profile
            });
            if (error) throw error;

            showNotification('Đăng ký thành công! Vui lòng kiểm tra email xác nhận (nếu có) hoặc đăng nhập.', 'success');
            document.getElementById('register-form').reset();
        } catch (error) {
            showNotification(`Lỗi: ${error.message}`, 'error');
        }
    });
</script>
