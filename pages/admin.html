<script>
    requireAdmin(); // Chặn đứng ngay lập tức nếu kẻ gian cố tình truy cập file admin.html static

    document.addEventListener('DOMContentLoaded', () => {
        // Khởi động chuyển đổi tab quản trị
        document.querySelectorAll('.admin-tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tabName = btn.getAttribute('data-admin-tab');
                switchAdminTab(tabName, e.target);
            });
        });

        loadAdminDashboard();

        // Xử lý tạo truyện thật thông qua API phân quyền
        document.getElementById('add-story-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const comicData = {
                    title: document.getElementById('story-title').value,
                    slug: document.getElementById('story-title').value.toLowerCase().replace(/ /g, '-'),
                    author: document.getElementById('story-author').value,
                    status: document.getElementById('story-status').value,
                    description: document.getElementById('story-description').value,
                    coverUrl: document.getElementById('story-cover').value
                };

                await createComic(comicData);
                showNotification('Truyện mới đã được tạo và đồng bộ lên Database thành công!', 'success');
                document.getElementById('add-story-form').reset();
                loadAdminDashboard(); // Refresh dữ liệu
            } catch (error) {
                showNotification(`Lỗi: ${error.message}`, 'error');
            }
        });
    });

    function switchAdminTab(tabName, targetBtn) {
        document.querySelectorAll('.admin-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabName).classList.add('active');
        targetBtn.classList.add('active');
    }

    async function loadAdminDashboard() {
        try {
            // Lấy dữ liệu công khai từ backend phân trang
            const res = await getComics(1, 100);
            const comics = res.items || res || [];

            document.getElementById('total-stories').textContent = comics.length;
            
            // Render bảng thống kê quản lý truyện
            const storiesTable = document.getElementById('stories-table');
            const recentTable = document.getElementById('recent-stories-table');

            const tableHtml = comics.map(comic => `
                <tr>
                    <td>${comic.id}</td>
                    <td><strong>${comic.title}</strong></td>
                    <td>${comic.author || 'Chưa rõ'}</td>
                    <td><span class="story-status">${comic.status || 'Ongoing'}</span></td>
                    <td>👁️ ${comic.totalViews || 0}</td>
                    <td>
                        <button class="btn btn-danger action-btn" onclick="executeDeleteComic(${comic.id})">Xóa</button>
                    </td>
                </tr>
            `).join('');

            recentTable.innerHTML = tableHtml;
            storiesTable.innerHTML = tableHtml;

        } catch (error) {
            console.error('Lỗi tải dữ liệu dashboard admin:', error);
        }
    }

    // Hàm gọi API xóa thành viên độc quyền từ tầng Admin Backend
    async function executeDeleteUser(userId) {
        if (confirm('CẢNH BÁO: Bạn có chắc chắn muốn xóa vĩnh viễn người dùng này khỏi hệ thống?')) {
            try {
                await adminDeleteUser(userId);
                showNotification('Đã thực thi lệnh xóa thành viên thành công!', 'success');
                // Refresh lại danh sách thành viên sau khi xóa
            } catch (error) {
                showNotification(`Thất bại: ${error.message}`, 'error');
            }
        }
    }
</script>
