<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMC Truyện - Trang Chủ</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { position: relative; background: #fff; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; color: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 28px; font-weight: bold; color: #aaa; cursor: pointer; }
        .hidden { display: none !important; }
        .switch-auth { margin-top: 15px; text-align: center; font-size: 14px; }
        .switch-auth a { color: #007bff; cursor: pointer; text-decoration: underline; }
        /* Các style khác giữ nguyên như cũ... */
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="/index.html" class="logo">📚 CMC Truyện</a>
            <nav>
                <a href="/pages/story.html" class="nav-link">Tìm Truyện</a>
                <div id="auth-links">
                    <a href="#" class="nav-link" onclick="window.toggleAuthModal(true)">Đăng nhập</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        </main>

    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="window.toggleAuthModal(false)">&times;</span>
            
            <div class="auth-box" id="login-box">
                <h2>Đăng Nhập</h2>
                <form id="login-form" onsubmit="window.handleLogin(event)">
                    <div class="form-group"><input type="email" id="login-email" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" id="login-password" placeholder="Mật khẩu" required></div>
                    <button type="submit" class="btn btn-primary">Đăng Nhập</button>
                </form>
                <p class="switch-auth">Chưa có tài khoản? <a onclick="window.switchForm('register')">Đăng ký ngay</a></p>
            </div>

            <div class="auth-box hidden" id="register-box">
                <h2>Đăng Ký</h2>
                <form id="register-form" onsubmit="window.handleRegister(event)">
                    <div class="form-group"><input type="text" id="register-username" placeholder="Tên hiển thị" required></div>
                    <div class="form-group"><input type="email" id="register-email" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" id="register-password" placeholder="Mật khẩu" required></div>
                    <button type="submit" class="btn btn-primary">Đăng Ký</button>
                </form>
                <p class="switch-auth">Đã có tài khoản? <a onclick="window.switchForm('login')">Đăng nhập</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginUser, registerUser } from './js/auth.js';

        // Điều khiển Modal
        window.toggleAuthModal = (show) => {
            document.getElementById('auth-modal').style.display = show ? 'flex' : 'none';
        };

        window.switchForm = (type) => {
            document.getElementById('login-box').classList.toggle('hidden');
            document.getElementById('register-box').classList.toggle('hidden');
        };

        // Xử lý Login
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await loginUser(email, password);
                alert("Đăng nhập thành công!");
                window.location.reload();
            } catch (err) {
                alert("Lỗi đăng nhập: " + err.message);
            }
        };

        // Xử lý Register
        window.handleRegister = async (e) => {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            try {
                await registerUser(username, email, password);
                alert("Đăng ký thành công! Hãy đăng nhập.");
                window.switchForm('login');
            } catch (err) {
                alert("Lỗi đăng ký: " + err.message);
            }
        };
    </script>
</body>
</html>
