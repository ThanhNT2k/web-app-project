<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test API - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .test-box { background: white; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; box-shadow: var(--shadow); }
        pre { background: #1f2937; color: #10b981; padding: 1rem; border-radius: 8px; overflow-x: auto; margin-top: 1rem; }
    </style>
</head>
<body>
    <main style="max-width: 800px; margin: 2rem auto;">
        <h1>🧪 Debug API</h1>
        
        <div class="test-box">
            <h3>1. Kiểm tra trạng thái User</h3>
            <button class="btn btn-primary" onclick="testAuth()">Xem User hiện tại</button>
            <pre id="auth-output">Chưa kiểm tra...</pre>
        </div>

        <div class="test-box">
            <h3>2. Lấy lịch sử đọc (History)</h3>
            <button class="btn btn-primary" onclick="testHistory()">Fetch History API</button>
            <pre id="history-output">Chưa kiểm tra...</pre>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        // Kiểm tra Auth từ localStorage
        function testAuth() {
            const user = getCurrentUser();
            document.getElementById('auth-output').textContent = JSON.stringify(user, null, 2);
        }

        // Kiểm tra gọi API thật
        async function testHistory() {
            const output = document.getElementById('history-output');
            output.textContent = "Đang tải...";
            
            try {
                // Giả sử bạn có hàm getReadingHistory trong api.js
                const data = await getReadingHistory();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = "Lỗi: " + err.message;
            }
        }
    </script>
</body>
</html>
