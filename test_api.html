<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>API Testing Dashboard - CMC Truyện</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .test-section { background: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; box-shadow: var(--shadow); }
        pre { background: #1f2937; color: #10b981; padding: 1rem; border-radius: 8px; overflow-x: auto; margin-top: 1rem; font-size: 0.9rem; }
        .grid-tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    </style>
</head>
<body>
    <main style="max-width: 1000px; margin: 2rem auto; padding: 0 1rem;">
        <h1>🧪 Debug & Test API Dashboard</h1>
        
        <div class="grid-tests">
            <div class="test-section">
                <h3>1. Kiểm tra Auth</h3>
                <button class="btn btn-primary" onclick="testAuth()">Xem User Local</button>
                <button class="btn" style="background:var(--danger-color); color:white" onclick="logout()">Đăng xuất</button>
                <pre id="auth-output">Chưa test...</pre>
            </div>

            <div class="test-section">
                <h3>2. Kiểm tra Profile API</h3>
                <button class="btn btn-primary" onclick="testProfile()">Fetch Profile</button>
                <pre id="profile-output">Chưa test...</pre>
            </div>

            <div class="test-section">
                <h3>3. Kiểm tra Lịch sử đọc</h3>
                <button class="btn btn-primary" onclick="testHistory()">Fetch History</button>
                <pre id="history-output">Chưa test...</pre>
            </div>

            <div class="test-section">
                <h3>4. Quyền Admin</h3>
                <button class="btn" style="background:var(--warning-color)" onclick="testAdminAccess()">Test Admin Access</button>
                <pre id="admin-output">Chưa test...</pre>
            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        // Hiển thị helper
        const log = (id, data) => document.getElementById(id).textContent = JSON.stringify(data, null, 2);

        function testAuth() {
            log('auth-output', getCurrentUser());
        }

        async function testProfile() {
            try {
                const data = await getProfile(); // Hàm trong api.js
                log('profile-output', data);
            } catch (err) { log('profile-output', { error: err.message }); }
        }

        async function testHistory() {
            try {
                const data = await getReadingHistory(); // Hàm trong api.js
                log('history-output', data);
            } catch (err) { log('history-output', { error: err.message }); }
        }

        function testAdminAccess() {
            if (isAdmin()) {
                document.getElementById('admin-output').textContent = "✅ Quyền hạn: ADMIN (Có quyền truy cập)";
            } else {
                document.getElementById('admin-output').textContent = "❌ Quyền hạn: USER (Từ chối truy cập)";
            }
        }
    </script>
</body>
</html>
